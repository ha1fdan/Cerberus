[project]
name = "cerberus"
version = "0.1.0"
description = "🐕 Cerberus SSO Forward Auth Gateway"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "jinja2>=3.1.6",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.51.0",
    "webauthn>=3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "soft-webauthn>=0.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
