<html>
  <head>
    <title>{% block title %}Cerberus{% endblock %}</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        margin: 0;
        min-height: 100vh;
      }
      a { color: #60a5fa; }
      .center {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        background: #1e293b;
        padding: 2rem;
        border-radius: 8px;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      .wide-card {
        background: #1e293b;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        margin-bottom: 1.5rem;
      }
      main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
      input, select {
        width: 100%;
        padding: 0.65rem;
        margin: 0.4rem 0 1rem 0;
        background: #334155;
        border: 1px solid #475569;
        color: white;
        border-radius: 4px;
      }
      label { font-size: 0.9rem; color: #cbd5e1; }
      button, .btn {
        padding: 0.65rem 1rem;
        background: #2563eb;
        border: none;
        color: white;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      button:hover, .btn:hover { background: #1d4ed8; }
      button.danger, .btn.danger { background: #dc2626; }
      button.danger:hover, .btn.danger:hover { background: #b91c1c; }
      button.ghost, .btn.ghost { background: #334155; }
      button.ghost:hover, .btn.ghost:hover { background: #475569; }
      .status { min-height: 1.2rem; margin-top: 0.75rem; font-size: 0.9rem; color: #94a3b8; }
      .error { color: #f87171; }
      .flash { background: #14532d; border: 1px solid #16a34a; padding: 1rem; border-radius: 6px; margin-bottom: 1.5rem; word-break: break-all; }
      .flash.error { background: #450a0a; border-color: #dc2626; color: #fecaca; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid #334155; }
      th { color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; }
      form.inline { display: inline; }
      .topnav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #1e293b;
      }
      .topnav .brand { font-weight: bold; }
      .topnav .links a { margin-left: 1.2rem; color: #cbd5e1; }
      .topnav .links a:hover { color: white; }
      .apps-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 1rem;
      }
      .app-tile {
        background: #1e293b;
        border-radius: 8px;
        padding: 1.25rem 1rem;
        text-align: center;
        text-decoration: none;
        color: white;
      }
      .app-tile:hover { background: #253449; }
      .app-tile img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 0.5rem; }
      .app-tile .letter-avatar {
        width: 48px; height: 48px; border-radius: 8px; background: #2563eb;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.3rem; font-weight: bold; margin: 0 auto 0.5rem auto;
      }
    </style>
  </head>
  <body>
    {% if user %}
    <nav class="topnav">
      <span class="brand">🐕 Cerberus</span>
      <div class="links">
        <a href="/">Apps</a>
        <a href="/profile">Profile</a>
        {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
        <a href="/logout">Logout</a>
      </div>
    </nav>
    {% endif %}
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
