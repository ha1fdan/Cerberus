server {
    listen 443 ssl;
    server_name app1.example.com;

    # 1. The Protection Gate
    location / {
        auth_request        /sso-verify;
        error_page 401    = @login;
        
        # Pass the verified username to your app
        auth_request_set    $user $upstream_http_x_sso_user;
        proxy_set_header    X-Remote-User $user;

        # Your actual application backend
        proxy_pass http://127.0.0.1:8080; 
    }

    # 2. The Silent Handshake (Behind the scenes)
    location = /sso-verify {
        internal;
        proxy_pass http://127.0.0.1:5000/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # 3. The Redirect 
    location @login {
        return 302 https://auth.example.com/login?rd=$scheme://$http_host$request_uri;
    }
}